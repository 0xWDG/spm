name: Bug report
description: Report a reproducible problem with spm.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve spm. Remove credentials and other sensitive data from logs before submitting.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the command and the smallest project or sequence that reproduces the issue.
      placeholder: |
        1. Run ...
        2. Observe ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the spm revision or release, macOS version, Xcode version, and output of `swift --version`.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste sanitized logs or screenshots if they help explain the problem.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Preflight checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed credentials and sensitive data from this report.
          required: true
